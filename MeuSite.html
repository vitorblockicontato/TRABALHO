<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Site</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #111;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #222;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px;
    }

    nav a {
      text-decoration: none;
    }

    /* BOTÕES DO MENU */
    .btn {
      background: #00c896;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00a67d;
    }

    /* CARDS */
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .card {
      background: #2f2f4f;
      padding: 20px;
      border-radius: 15px;
      transition: 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-10px);
      background: #3f3f6f;
    }
  </style>
</head>
<body>

<header>
  <h1>🚀 Meu Site Pessoal</h1>
</header>

<!-- CARDS INTERATIVOS -->
<div class="container">

  <div class="card" onclick="abrir('sobre.html')">
    <h2>👤 Sobre Mim</h2>
    <p>Conheça minha história</p>
  </div>

  <div class="card" onclick="abrir('formacao.html')">
    <h2>🎓 Formação</h2>
    <p>Meus estudos</p>
  </div>

  <div class="card" onclick="abrir('portifolio.html')">
    <h2>💻 Portfólio</h2>
    <p>Meus projetos</p>
  </div>

  <div class="card" onclick="abrir('contato.html')">
    <h2>📩 Contato</h2>
    <p>Fale comigo</p>
  </div>

</div>

<script>
  // Função para abrir páginas em nova aba
  function abrir(pagina) {
    window.open(pagina, "_blank");
  }

  console.log("Página inicial carregada!");
</script>

</body>
</html>
